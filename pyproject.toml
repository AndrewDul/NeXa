[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexa"
version = "0.0.0"
description = "NeXa — one personal, local-first AI system across the user's devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Andrzej Dul" }]
keywords = ["nexa", "ai", "assistant", "local-first", "companion"]

# M0 has no runtime dependencies on purpose. Subsystems add their own,
# each justified by an ADR. Do not grow this list speculatively.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
