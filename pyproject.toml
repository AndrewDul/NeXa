[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexa"
version = "0.0.0"
description = "NeXa — one personal, local-first AI system across the user's devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Andrzej Dul" }]
keywords = ["nexa", "ai", "assistant", "local-first", "companion"]

# Runtime dependencies, each justified by an ADR. Do not grow this list
# speculatively.
dependencies = [
  # M2.1 (ADR-0003 D1): local realtime voice orchestration. Pinned exactly
  # (no floating range) since the current API (PipelineWorker/WorkerRunner)
  # is new enough that PipelineTask/PipelineRunner are still the commonly
  # documented — but deprecated since 1.3.0 — path. The `local` extra pulls
  # in pyaudio for local mic/speaker I/O. Deliberately NOT `local-smart-turn`
  # (ADR-0003 D10: its CoreML path does not work on this Linux/ARM64 Pi).
  "pipecat-ai[local]==1.8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
# ADR-0004 Decision L (M2.6B.2): GeminiLiveProvider (`nexa.realtime.gemini.
# service`) needs `google-genai` at runtime — Pipecat 1.8.1's own
# `gemini_live/llm.py` imports it directly. Kept OPTIONAL so `pip install .`
# (no extra) stays Google-cloud-free for LOCAL_ONLY / local-first installs;
# `nexa.realtime.gemini.service` defers every Pipecat/Gemini import to
# inside `GeminiLiveProvider.start()`, so importing the module itself never
# requires this extra. `websockets` is pinned to the range `google-genai`
# 2.22.0 resolved to in the M2.6A/M2.6B research venv (R0030/R0031),
# within Pipecat's own `websockets>=13.1` constraint.
cloud-gemini = [
  "google-genai>=2.22,<3",
  "websockets>=15,<17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
